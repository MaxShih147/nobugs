<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#141621"/>
      <stop offset="100%" stop-color="#0a0b10"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="40" y1="200" x2="472" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c4b5fd"/>
      <stop offset="100%" stop-color="#8b7cf6"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="256" cy="256" r="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8b7cf6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#8b7cf6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="112" ry="112" fill="url(#ambientGlow)"/>
  <rect x="2" y="2" width="508" height="508" rx="110" ry="110"
        fill="none" stroke="#8b7cf6" stroke-opacity="0.08" stroke-width="2.5"/>

  <!-- Wordmark -->
  <text x="256" y="288" text-anchor="middle" dominant-baseline="central"
        font-family="'Outfit', 'SF Pro Display', 'Helvetica Neue', sans-serif"
        font-size="120" font-weight="700" letter-spacing="-3"
        fill="url(#textGrad)">nobugs</text>
</svg>
